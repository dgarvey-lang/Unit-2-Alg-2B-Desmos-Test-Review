<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Quadratics Warm-Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: problem card on the left, tools (Desmos + scratch board) on the right; stacks on narrow screens. */
:root{
  --paper:#EDF2F5; --grid:#D3DEE6; --card:#FFFFFF; --ink:#15212C; --muted:#4D5E6B; --line:#C3D0DA;
  --accent:#D2452A; --accent-ink:#FFFFFF; --blue:#2563C9; --blue-ink:#FFFFFF;
  --good:#13804A; --good-bg:#DDF3E6; --bad:#B42318; --bad-bg:#FBE3E0; --soft:#E4ECF2;
  --pen-blue:#2563C9; --pen-red:#C8321E;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E161D; --grid:#1A2731; --card:#15212B; --ink:#E5EDF2; --muted:#A3B4C0; --line:#2A3B48;
  --accent:#F26B4F; --accent-ink:#1A0D09; --blue:#4F8BEF; --blue-ink:#FFFFFF;
  --good:#4BD08A; --good-bg:#12321F; --bad:#FF8A7A; --bad-bg:#3A1714; --soft:#1C2A35;
  --pen-blue:#6FA3F5; --pen-red:#FF8A7A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E161D; --grid:#1A2731; --card:#15212B; --ink:#E5EDF2; --muted:#A3B4C0; --line:#2A3B48;
  --accent:#F26B4F; --accent-ink:#1A0D09; --blue:#4F8BEF; --blue-ink:#FFFFFF;
  --good:#4BD08A; --good-bg:#12321F; --bad:#FF8A7A; --bad-bg:#3A1714; --soft:#1C2A35;
  --pen-blue:#6FA3F5; --pen-red:#FF8A7A; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;min-height:100vh}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.mast{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.mast h1{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.01em}
.mast .sub{color:var(--muted)}
.mast .grow{flex:1}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:22px}
.eyebrow{font-size:13px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.btn{border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 16px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.primary:hover,.btn.blue:hover{filter:brightness(1.08)}
.btn.small{padding:5px 11px;font-size:15px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* setup */
.setup{max-width:760px}
.setup p{max-width:64ch}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field label{font-weight:700}
.field input{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);max-width:320px}
.howto{margin:14px 0 0;padding-left:22px}
.howto li{margin:6px 0}
/* main layout */
.layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.tools{position:sticky;top:12px;display:grid;gap:12px}
@media (max-width:900px){.tools{position:static}}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.step{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center}
.step[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--card)}
.step .ck{color:var(--good)}
.step[aria-current="true"] .ck{color:inherit}
.role{background:var(--soft);border-radius:10px;padding:10px 14px;margin:12px 0 4px;font-size:16px}
.prompt{font-size:18px;margin:10px 0 4px;max-width:64ch}
.eq{font-family:var(--mono);font-weight:700;background:var(--soft);padding:2px 8px;border-radius:6px;white-space:nowrap}
.part{border-top:1.5px solid var(--line);padding-top:14px;margin-top:16px}
.part h3{font-size:19px;display:flex;gap:8px;align-items:baseline}
.part h3 .pl{font-family:var(--mono);color:var(--accent)}
.part.done h3::after{content:"✓";color:var(--good);font-family:var(--body)}
.part .q{margin:6px 0 10px;max-width:64ch}
.choices{display:grid;gap:8px}
.choice{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:flex-start}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}
label.choice{cursor:pointer}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input{font:inherit;font-family:var(--mono);font-size:20px;width:220px;max-width:100%;padding:7px 12px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.fb{border-radius:10px;padding:10px 14px;margin-top:10px;border:2px solid var(--line);background:var(--paper)}
.fb.good{border-color:var(--good);background:var(--good-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb p{margin:4px 0}
.model{margin-top:10px;display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:560px){.model{grid-template-columns:1fr}}
.model svg{width:100%;height:auto;background:var(--paper);border-radius:10px;border:1.5px solid var(--line)}
.model ul{margin:0;padding-left:20px}
.talk{margin-top:16px;border-left:4px solid var(--blue);padding:6px 12px;background:var(--soft);border-radius:0 10px 10px 0}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
/* tools */
.tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tab{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;font-weight:700;font-family:var(--display);font-size:17px}
.tab[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.tabs .grow{flex:1}
.boardpanel{padding:14px 16px 16px}
.dnote{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:0 0 8px}
.dnote a{color:var(--blue);font-weight:700}
#dframe{display:block;width:100%;height:clamp(420px,calc(100vh - 190px),680px);border:1.5px solid var(--line);border-radius:10px;background:#fff}
@media (max-width:900px){#dframe{height:480px}}
.tools.big #dframe{height:calc(100vh - 150px)}
.boardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.boardhead h2{font-size:20px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.swatch{width:34px;height:34px;border-radius:999px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.swatch span{width:18px;height:18px;border-radius:999px;display:block}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.boardbox{position:relative;width:100%;aspect-ratio:4/3;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.boardbox.grid{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:5% 6.6667%}
.boardbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.boardnote{font-size:14px;color:var(--muted);margin:6px 0 0}
.tools.big .boardpanel{position:fixed;inset:12px;z-index:20;overflow:auto;display:flex;flex-direction:column}
.tools.big .boardbox{width:min(100%,calc((100vh - 150px)*4/3));margin:0 auto}
/* finish */
.conf{display:grid;gap:10px;margin-top:12px}
.conf .item{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--paper)}
.tips li{margin:6px 0}
.scorebig{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:6px 0 4px}
.scorebig .num{font-family:var(--display);font-size:56px;font-weight:800;line-height:1}
.scorebig .num span{font-size:28px;color:var(--muted)}
.scorebig .pct{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--accent)}
.scorebig p{margin:0;max-width:44ch}
.scorenote{font-size:14px;color:var(--muted);margin:6px 0 10px}
table.scoretab{width:100%;border-collapse:collapse;margin-top:6px}
.scoretab th,.scoretab td{text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line)}
.scoretab th{font-size:14px;color:var(--muted)}
.step.extra{border-style:dashed}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DESMOS='https://www.desmos.com/calculator';
const SAVE='u2-warmup-v2';
function load(){ try{ return JSON.parse(localStorage.getItem(SAVE)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(SAVE, JSON.stringify(S)); }catch(e){} }

/* small graph for the model sketch in Problem 1 */
function graphSVG(f, [x0,x1], [y0,y1], dots){
  const W=260,H=220,P=22, X=x=>P+(x-x0)/(x1-x0)*(W-2*P), Y=y=>H-P-(y-y0)/(y1-y0)*(H-2*P);
  let g='';
  for(let x=Math.ceil(x0);x<=x1;x++) g+=`<line x1="${X(x)}" y1="${P}" x2="${X(x)}" y2="${H-P}" stroke="var(--grid)"/>`;
  const ys=[1,2,5,10,20,50,100,200].find(v=>(y1-y0)/v<=12)||500;
  for(let y=Math.ceil(y0/ys)*ys;y<=y1;y+=ys) g+=`<line x1="${P}" y1="${Y(y)}" x2="${W-P}" y2="${Y(y)}" stroke="var(--grid)"/>`;
  g+=`<line x1="${P}" y1="${Y(0)}" x2="${W-P}" y2="${Y(0)}" stroke="var(--ink)" stroke-width="1.5"/><line x1="${X(0)}" y1="${P}" x2="${X(0)}" y2="${H-P}" stroke="var(--ink)" stroke-width="1.5"/>`;
  let d=''; for(let i=0;i<=120;i++){ const x=x0+(x1-x0)*i/120, y=f(x); if(y>y1+2) continue; d+=(d?'L':'M')+X(x).toFixed(1)+' '+Y(Math.max(y0,y)).toFixed(1); }
  g+=`<path d="${d}" fill="none" stroke="var(--pen-blue)" stroke-width="3"/>`;
  dots.forEach(([x,y,l,an])=>g+=`<circle cx="${X(x)}" cy="${Y(y)}" r="5" fill="var(--pen-red)"/><text x="${X(x)+(an==='end'?-4:an==='start'?4:0)}" y="${Y(y)+20}" text-anchor="${an||'middle'}" font-size="12" font-weight="700" fill="var(--ink)" font-family="var(--mono)">${l}</text>`);
  g+=`<text x="${W-P+4}" y="${Y(0)+4}" font-size="12" fill="var(--ink)">x</text><text x="${X(0)+5}" y="${P-6}" font-size="12" fill="var(--ink)">y</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Model sketch">${g}</svg>`;
}
function rocketSVG(h0,v,what){ return `<svg viewBox="0 0 260 220" role="img" aria-label="Model diagram of the launch">
  <line x1="10" y1="196" x2="250" y2="196" stroke="var(--ink)" stroke-width="2"/>
  <text x="12" y="213" font-size="12" fill="var(--ink)" font-weight="700">ground: h = 0</text>
  <rect x="20" y="140" width="40" height="56" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.5"/>
  <line x1="68" y1="140" x2="68" y2="196" stroke="var(--pen-red)" stroke-width="1.5"/>
  <text x="72" y="172" font-size="12" fill="var(--pen-red)" font-weight="700">${h0} ft</text>
  <path d="M40 140 Q 120 -10 215 196" fill="none" stroke="var(--pen-blue)" stroke-width="3" stroke-dasharray="6 5"/>
  <circle cx="40" cy="140" r="5" fill="var(--ink)"/><text x="10" y="132" font-size="12" fill="var(--ink)">t = 0</text>
  <circle cx="215" cy="196" r="5" fill="var(--pen-red)"/><text x="250" y="213" text-anchor="end" font-size="12" fill="var(--ink)">lands: t = ?</text>
  <text x="70" y="30" font-size="12" fill="var(--ink)">${what} starts at ${v} ft/s ↑</text>
</svg>`; }
const ROCKET_SVG=rocketSVG(48,64,'ball');
function gardenSVG(len,A,thing){ return `<svg viewBox="0 0 260 220" role="img" aria-label="Model diagram of the ${thing}">
  <rect x="30" y="50" width="200" height="100" fill="var(--soft)" stroke="var(--ink)" stroke-width="2"/>
  <text x="130" y="105" text-anchor="middle" font-size="14" fill="var(--ink)" font-weight="700">Area = ${A} ft²</text>
  <text x="130" y="40" text-anchor="middle" font-size="14" fill="var(--pen-red)" font-weight="700">length = ${len}</text>
  <text x="22" y="104" text-anchor="end" font-size="14" fill="var(--pen-blue)" font-weight="700">w</text>
  <text x="130" y="175" text-anchor="middle" font-size="13" fill="var(--muted)">width = w</text>
</svg>`; }
const GARDEN_SVG=gardenSVG('2w + 3',189,'garden');

/* ============ problems (same skills as the test, new numbers) ============ */
const PROBS=[
 {title:'Solve by graphing', short:'Graphing',
  prompt:`Solve <span class="eq">2x² + 10x + 12 = 0</span> by graphing. Sketch the graph to show what you found.`,
  copy:'y=2x^2+10x+12',
  talk:'Why do the x-intercepts of the graph give the solutions to the equation? (Hint: what is y at an x-intercept?)',
  parts:[
   {type:'mc', q:'What should you type into Desmos to solve this equation?',
    ch:['y = 2x² + 10x + 12','y = 0','x = 2x² + 10x + 12','2x² + 10x = 12'], a:0,
    why:['Right. Graph the quadratic, then look where it crosses the x-axis (where y = 0).','y = 0 is just the x-axis. Graph the quadratic expression as y = …','Use y = …, not x = …, so the graph is a parabola that opens up or down.','This moves the 12 the wrong way and still is not a graph you can read solutions from. Use y = 2x² + 10x + 12.']},
   {type:'num', q:'Click the x-intercepts in Desmos. What are the solutions? Type both, separated by a comma.',
    ans:[-2,-3], tol:0.01,
    errs:[{test:v=>v.length===1, msg:'A parabola that crosses the x-axis twice has <b>two</b> solutions. Type both, separated by a comma.'},
          {test:v=>v.some(x=>Math.abs(x-2)<.01||Math.abs(x-3)<.01), msg:'Check the signs. Both x-intercepts are to the <b>left</b> of the y-axis.'},
          {test:v=>v.some(x=>Math.abs(x+2.5)<.01), msg:'−2.5 is the vertex, not a solution. Solutions are where the graph crosses the x-axis.'},
          {test:v=>v.some(x=>Math.abs(x-12)<.01), msg:'12 is the y-intercept. Solutions are on the x-axis.'}],
    hint:'In Desmos, click the gray dots where the parabola touches the x-axis. Read the x-value of each.',
    sol:'x = −2 and x = −3. (Check: 2(−2)² + 10(−2) + 12 = 8 − 20 + 12 = 0 ✓)'},
   {type:'draw', q:'On the scratch board, sketch the graph. Mark and label both x-intercepts.',
    model:()=>graphSVG(x=>2*x*x+10*x+12,[-5,1],[-2,13],[[-3,0,'(−3, 0)','end'],[-2,0,'(−2, 0)','start']]),
    check:['Axes are drawn and labeled x and y','A parabola that opens up','Both x-intercepts are marked: (−3, 0) and (−2, 0)','The solutions are written: x = −3, x = −2']}
  ]},
 {title:'Two methods', short:'Two methods',
  prompt:`Solve <span class="eq">x² + 5 = 30</span> using two different methods.`,
  copy:'y=x^2+5',
  talk:'Which method was faster for you? Which one would you trust more on a test, and why?',
  parts:[
   {type:'num', q:'<b>Method 1: square roots.</b> Subtract 5, then take the square root of both sides. What are the solutions? Type both.',
    ans:[5,-5], tol:0.001,
    errs:[{test:v=>v.length===1&&Math.abs(Math.abs(v[0])-5)<.01, msg:'Almost! When you take a square root, remember <b>±</b>. There are two answers.'},
          {test:v=>v.some(x=>Math.abs(Math.abs(x)-Math.sqrt(35))<.01), msg:'It looks like you added 5. Subtract 5 from both sides first: x² = 25.'},
          {test:v=>v.some(x=>Math.abs(Math.abs(x)-12.5)<.01), msg:'x² = 25 means take the <b>square root</b>, not divide by 2.'}],
    hint:'x² + 5 = 30 → x² = 25 → x = ±√25',
    sol:'x² + 5 = 30 → x² = 25 → x = ±√25 → <b>x = 5 or x = −5</b>'},
   {type:'multi', q:'<b>Method 2.</b> Which of these are <b>different methods that also work</b>? Pick all that work.',
    ch:['Subtract 30, then factor: x² − 25 = (x − 5)(x + 5) = 0',
        'Graph y = x² + 5 and y = 30 in Desmos and find where they cross',
        'Subtract 30, then use the quadratic formula on x² − 25 = 0',
        'Divide both sides by x',
        'Subtract 5, then divide both sides by 2'],
    a:[0,1,2],
    hint:'Three of these work. Dividing by x loses solutions, and "divide by 2" treats x² as if it were 2x.',
    sol:'Factoring, graphing two lines and finding where they cross, and the quadratic formula all work. Dividing by x is not allowed (it loses solutions), and x² is not 2x.'},
   {type:'draw', q:'On the scratch board, solve it a <b>second way</b> and show every step. Then check that you got the same answers.',
    model:()=>`<svg viewBox="0 0 260 200" role="img" aria-label="Model work by factoring"><g font-family="var(--mono)" font-size="15" fill="var(--ink)">
      <text x="16" y="34">x² + 5 = 30</text><text x="16" y="64">x² − 25 = 0</text><text x="16" y="94">(x − 5)(x + 5) = 0</text>
      <text x="16" y="124">x − 5 = 0  or  x + 5 = 0</text><text x="16" y="160" font-weight="700" fill="var(--pen-red)">x = 5  or  x = −5 ✓</text></g></svg>`,
    check:['The method is named (factoring, graphing, or quadratic formula)','Every step is written, not just the answer','Both answers: x = 5 and x = −5','Both methods give the same answers']}
  ]},
 {title:'Projectile motion', short:'Projectile',
  prompt:`You throw a ball upward from the edge of a cliff that is <b>48 feet</b> tall. It leaves your hand at <b>64 feet per second</b>. Its height is modeled by <span class="eq">h = −16t² + 64t + 48</span>, where t is time in seconds.`,
  copy:'y=-16x^2+64x+48',
  talk:'Desmos shows two x-intercepts. Why does only one of them make sense for this problem?',
  parts:[
   {type:'draw', q:'Draw and label a diagram of the throw: the cliff, its height, the path of the ball, and the ground.',
    model:()=>ROCKET_SVG,
    check:['The cliff with its height labeled (48 ft)','The curved path of the ball','The ground labeled (h = 0)','Start and landing points marked']},
   {type:'mc', q:'What value of h represents the ground?',
    ch:['h = 0','h = 48','h = 64','h = −16'], a:0,
    why:['Right. Height 0 is the ground, so you solve 0 = −16t² + 64t + 48.','48 is the height of the cliff, where the ball starts.','64 is the starting speed (feet per second), not a height.','−16 is from gravity. It is not a height.']},
   {type:'mc', q:'In the equation, what does the 48 tell you?',
    ch:['The starting height: the ball begins 48 ft above the ground','The time it takes to land','The highest point the ball reaches','The speed of the ball'], a:0,
    why:['Yes. At t = 0, h = 48, which is the top of the cliff.','Time is what you solve for. The 48 is a height.','The highest point is the vertex. In Desmos it is at t = 2, h = 112.','The speed is the 64 in front of t.']},
   {type:'num', q:'How long does it take the ball to hit the ground? Round to the nearest <b>hundredth</b> of a second.',
    ans:[4.65], tol:0.001,
    errs:[{test:v=>v.some(x=>Math.abs(x+0.65)<.01), msg:'That is the negative x-intercept. Time can\'t be negative, so use the other one.'},

function scoreOf(idxs){ let pts=0,max=0,first=0,done=0;
  idxs.forEach(p=>getP(p).parts.forEach((pt,i)=>{ if(pt.type==='draw') return; max++; const st=S.parts[pk(p,i)]||{};

  </div>`;
  $('#restart').onclick=()=>{ if(confirm('Start over? This clears your answers and drawings.')){ try{localStorage.removeItem(SAVE);}catch(e){} S=null; setup={mode:'pair',names:['','']}; renderSetup(); } };
  rebuildExtra();
  Board.init();
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setTab(t.dataset.tab));
  setTab(S.tab||'desmos');
  show(S.cur);
}

function setTab(t){
  S.tab=t; save();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===t));
  $('#paneD').hidden = t!=='desmos'; $('#paneB').hidden = t!=='board';
  const f=$('#dframe'); if(t==='desmos' && !f.src) f.src=DESMOS;
}
/* switch to the scratch board when a part asks students to draw */
function toBoard(){ if(S.tab!=='board') setTab('board'); }

function renderSteps(){
  $('#steps').innerHTML=PROBS.map((p,i)=>`<button class="step" data-i="${i}" aria-current="${S.cur===i}">${i+1}. ${p.short}${probDone(i)?'<span class="ck">✓</span>':''}</button>`).join('')
    +`<button class="step" data-i="${FIN}" aria-current="${S.cur===FIN}">Score</button>`
    +EXTRA.map((p,j)=>{ const i=FIN+1+j; return `<button class="step extra" data-i="${i}" aria-current="${S.cur===i}">+ ${p.short}${probDone(i)?'<span class="ck">✓</span>':''}</button>`; }).join('');
  $('#steps').onclick=e=>{ const b=e.target.closest('.step'); if(b) show(+b.dataset.i); };
}

function show(i){
  S.cur=i; save(); renderSteps();
  $('#tools').style.display = i===FIN ? 'none' : '';
  if(i===FIN){ renderFinish(); return; }
  Board.load(i);
  $('#boardfor').textContent='Problem '+(i+1);
  renderProb(i);
}

function roleLine(p){
  if(S.mode==='solo') return `<div class="role">Talk it through: say each step before you type or draw it.</div>`;
  const w=S.names[p%2], c=S.names[(p+1)%2];
  return `<div class="role"><b>Writer: ${esc(w)}</b> types and draws. <b>Coach: ${esc(c)}</b> explains each next step out loud first.</div>`;
}

function renderProb(p){
  const P=getP(p), isX=p>FIN, xn=p-FIN, nextX=isX&&p<FIN+EXTRA.length;
  $('#prob').innerHTML=`<section class="panel">
    <div class="eyebrow">${isX?`Extra practice ${xn}`:`Problem ${p+1} of ${PROBS.length}`} · ${P.title}</div>
    <p class="prompt">${P.prompt}</p>
    ${P.copy?`<div class="row"><span class="mono" style="font-size:15px;color:var(--muted)">For Desmos:</span> <span class="eq">${esc(P.copy)}</span> <button class="btn small" id="copy">Copy</button></div>`:''}
    ${roleLine(p)}
    ${P.parts.map((pt,i)=>`<div class="part ${pst(p,i).done?'done':''}" id="part${i}"></div>`).join('')}
    <div class="talk"><b>${S.mode==='pair'?'Talk about it':'Think about it'}:</b> ${P.talk}</div>
    <div class="nav">
      ${isX?`<button class="btn" id="prev">← Score</button>`:p>0?`<button class="btn" id="prev">← Problem ${p}</button>`:'<span></span>'}
      <button class="btn primary" id="next">${isX?(nextX?'Next extra problem →':'See my score →'):p<PROBS.length-1?`Next: Problem ${p+2} →`:'Finish and see my score →'}</button>
    </div></section>`;
  P.parts.forEach((_,i)=>renderPart(p,i));
  if(P.copy) $('#copy').onclick=e=>copyText(P.copy,e.target);
  const pv=$('#prev'); if(pv) pv.onclick=()=>show(isX?FIN:p-1);
  $('#next').onclick=()=>show(isX&&!nextX?FIN:p+1);
}

function copyText(t,btn){
  const done=()=>{ btn.textContent='Copied!'; setTimeout(()=>btn.textContent='Copy',1500); };
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(done,()=>fallback());
  else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); done();}catch(e){} ta.remove(); }
}

const L='abcdefgh';
function renderPart(p,i){
  const pt=getP(p).parts[i], st=pst(p,i), el=$('#part'+i);
  el.className='part'+(st.done?' done':'');
  let h=`<h3><span class="pl">${L[i]})</span></h3><div class="q">${pt.q}</div>`;
  if(pt.type==='mc'){
    h+=`<div class="choices">${pt.ch.map((c,k)=>`<button class="choice ${st.done&&k===pt.a?'right':''} ${(st.wrong||[]).includes(k)?'wrong':''}" data-k="${k}" ${st.done||(st.wrong||[]).includes(k)?'disabled':''}><span class="mono" style="font-weight:700">${'ABCD'[k]}</span><span>${c}</span></button>`).join('')}</div>`;
    if(st.msg) h+=`<div class="fb ${st.done?'good':'bad'}"><p>${st.msg}</p></div>`;
  } else if(pt.type==='multi'){
    h+=`<div class="choices">${pt.ch.map((c,k)=>`<label class="choice ${st.done?(pt.a.includes(k)?'right':''):''}"><input type="checkbox" data-k="${k}" ${st.done?'disabled':''} ${(st.picked||[]).includes(k)?'checked':''}><span>${c}</span></label>`).join('')}</div>`;
    if(!st.done) h+=`<div class="row" style="margin-top:10px"><button class="btn primary" id="chk${i}">Check</button>${(st.tries||0)>=2?`<button class="btn" id="sol${i}">Show solution</button>`:''}</div>`;
    if(st.msg) h+=`<div class="fb ${st.done?'good':'bad'}"><p>${st.msg}</p></div>`;
  } else if(pt.type==='num'){
    h+=`<div class="numrow"><input id="in${i}" inputmode="decimal" autocomplete="off" value="${esc(st.val||'')}" ${st.done?'disabled':''} aria-label="Answer for part ${L[i]}" placeholder="${pt.ans.length>1?'e.g. 1, −4':'answer'}">
      ${st.done?'':`<button class="btn primary" id="chk${i}">Check</button><button class="btn" id="hint${i}">Hint</button>${(st.tries||0)>=2?`<button class="btn" id="sol${i}">Show solution</button>`:''}`}</div>`;
    if(st.hint&&!st.done) h+=`<div class="fb"><p><b>Hint:</b> ${pt.hint}</p></div>`;
    if(st.msg) h+=`<div class="fb ${st.done?'good':'bad'}"><p>${st.msg}</p></div>`;
  } else if(pt.type==='expr'){
    h+=`<div class="numrow"><input id="in${i}" autocomplete="off" spellcheck="false" value="${esc(st.val||'')}" ${st.done?'disabled':''} aria-label="Answer for part ${L[i]}" placeholder="${esc(pt.ph)}" style="width:340px">
      ${st.done?'':`<button class="btn primary" id="chk${i}">Check</button><button class="btn" id="hint${i}">Hint</button>${(st.tries||0)>=2?`<button class="btn" id="sol${i}">Show solution</button>`:''}`}</div>
      <p style="margin:6px 0 0;font-size:14px;color:var(--muted)">Type ^ for exponents (w^2). You can write 2w or 2*w.</p>`;
    if(st.hint&&!st.done) h+=`<div class="fb"><p><b>Hint:</b> ${pt.hint}</p></div>`;
    if(st.msg) h+=`<div class="fb ${st.done?'good':'bad'}"><p>${st.msg}</p></div>`;
  } else if(pt.type==='draw'){
    if(!st.done) h+=`<div class="row"><button class="btn" id="gob${i}">Open the scratch board</button><button class="btn blue" id="cmp${i}">I drew it: compare with a model</button></div>`;
    else h+=`<div class="model">${pt.model()}<div><b>Check your board. Does it have:</b><ul>${pt.check.map(c=>`<li>${c}</li>`).join('')}</ul></div></div>`;
  }
  el.innerHTML=h;

  if(pt.type==='mc') el.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k; st.tries=(st.tries||0)+1;
    if(k===pt.a){ st.done=true; st.first = st.tries===1; } else { st.wrong=[...(st.wrong||[]),k]; }
    st.msg=pt.why[k]; save(); renderPart(p,i); renderSteps(); });
  if(pt.type==='multi'){
    el.querySelectorAll('input').forEach(cb=>cb.onchange=()=>{ st.picked=[...el.querySelectorAll('input:checked')].map(x=>+x.dataset.k); save(); });
    const c=$('#chk'+i); if(c) c.onclick=()=>{
      const pick=[...el.querySelectorAll('input:checked')].map(x=>+x.dataset.k).sort();
      st.tries=(st.tries||0)+1;
      if(pick.join()===[...pt.a].sort().join()){ st.done=true; st.first=st.tries===1; st.msg='Right! '+pt.sol; }
      else st.msg = pick.some(k=>!pt.a.includes(k)) ? 'At least one of your picks does not work. '+pt.hint : 'Everything you picked works, but you missed at least one. '+pt.hint;
      save(); renderPart(p,i); renderSteps(); };
    const s=$('#sol'+i); if(s) s.onclick=()=>{ st.done=true; st.shown=true; st.picked=pt.a; st.msg=pt.sol; save(); renderPart(p,i); renderSteps(); };
  }
  if(pt.type==='num'){
    const inp=$('#in'+i);
    const check=()=>{
      st.val=inp.value; const v=parseNums(inp.value);
      if(!v.length){ st.msg='Type a number first.'; renderPart(p,i); return; }
      st.tries=(st.tries||0)+1;
      const right = v.length===pt.ans.length && pt.ans.every(a=>v.some(x=>Math.abs(x-a)<=pt.tol)) && v.every(x=>pt.ans.some(a=>Math.abs(x-a)<=pt.tol));
      if(right){ st.done=true; st.first=st.tries===1; st.msg='Correct! '+pt.sol; }
      else { const e=(pt.errs||[]).find(e=>e.test(v)); st.msg=(e?e.msg:'Not quite. Check your work and try again.') + (st.tries>=2?' You can show the solution now if you need it.':''); }
      save(); renderPart(p,i); renderSteps();
      if(!st.done){ const n=$('#in'+i); n.focus(); n.select(); }
    };
    if(!st.done){ $('#chk'+i).onclick=check; inp.onkeydown=e=>{ if(e.key==='Enter') check(); };
      $('#hint'+i).onclick=()=>{ st.val=inp.value; st.hint=true; save(); renderPart(p,i); };
      const s=$('#sol'+i); if(s) s.onclick=()=>{ st.done=true; st.shown=true; st.val=pt.ans.join(', '); st.msg=pt.sol; save(); renderPart(p,i); renderSteps(); }; }
  }
  if(pt.type==='expr'){
    const inp=$('#in'+i);
    const check=()=>{
      st.val=inp.value; const src=inp.value.trim();
      if(!src){ st.msg='Type your answer first.'; renderPart(p,i); return; }
      const f=parseExpr(src, !!pt.eq);
      if(typeof f==='string'){ st.msg=f; renderPart(p,i); return; }
      st.tries=(st.tries||0)+1;
      const right = pt.eq ? (src.includes('=') && prop(f,pt.target)) : same(f,pt.target);
      if(right){ st.done=true; st.first=st.tries===1; st.msg='Correct! '+pt.sol; }
      else { const e=(pt.errs||[]).find(e=>e.test(f,src)); st.msg=(e?e.msg:'Not quite. Check your work and try again.') + (st.tries>=2?' You can show the solution now if you need it.':''); }
      save(); renderPart(p,i); renderSteps();
      if(!st.done){ const n=$('#in'+i); n.focus(); }
    };
    if(!st.done){ $('#chk'+i).onclick=check; inp.onkeydown=e=>{ if(e.key==='Enter') check(); };
      $('#hint'+i).onclick=()=>{ st.val=inp.value; st.hint=true; save(); renderPart(p,i); };
      const s=$('#sol'+i); if(s) s.onclick=()=>{ st.done=true; st.shown=true; st.msg=pt.sol; save(); renderPart(p,i); renderSteps(); }; }
  }
  if(pt.type==='draw'){ const g=$('#gob'+i); if(g) g.onclick=toBoard; }
  if(pt.type==='draw'){ const b=$('#cmp'+i); if(b) b.onclick=()=>{ st.done=true; save(); renderPart(p,i); renderSteps(); }; }
}

/* Turns typed math in w (or x) into a function. For an equation, returns left side minus right side.
   Returns a message string if it can't read it. */
function parseExpr(src, isEq){
  let s=src.toLowerCase().replace(/[−–]/g,'-').replace(/[×·]/g,'*').replace(/²/g,'^2').replace(/\s+/g,'');
  s=s.replace(/^(length|area|a|l)=/,'');
  if(!isEq) s=s.replace(/^.*=/,'');
  if(/[a-z]/.test(s.replace(/[wx]/g,''))) return 'Use only one letter, w, for the width. If you used another letter for the length, replace it with your expression for the length.';
  if(s.includes('w')&&s.includes('x')) return 'Use just one letter for the width (w).';
  s=s.replace(/x/g,'w');
  if(!/^[0-9w+\-*/^().=]+$/.test(s)) return 'I can only read numbers, w, + − * / ^ and parentheses.';
  const sides=s.split('=');
  if(sides.length>2) return 'Use only one equals sign.';
  const js=t=>t.replace(/(\d|w|\))(?=[w(])/g,'$1*').replace(/(w|\))(?=\d)/g,'$1*').replace(/\^/g,'**');
  try{
    const L=new Function('w','return ('+js(sides[0])+');'), R=sides.length>1?new Function('w','return ('+js(sides[1])+');'):()=>0;
    const f=w=>L(w)-R(w); if(!isFinite(f(1.7))) throw 0; return f;
  }catch(e){ return 'I couldn\'t read that. Check your parentheses and operation signs.'; }
}
const PTS=[1.3,2.7,4.1,5.9,8.2];
const same=(f,g)=>PTS.every(w=>Math.abs(f(w)-g(w))<1e-6*Math.max(1,Math.abs(g(w))));
const prop=(f,g)=>{ const k=f(PTS[0])/g(PTS[0]); return isFinite(k)&&Math.abs(k)>1e-9&&PTS.every(w=>Math.abs(f(w)-k*g(w))<1e-6*Math.max(1,Math.abs(k*g(w)))); };
const isLinear=f=>{ const a=f(1),b=f(2),c=f(3); return Math.abs(a-2*b+c)<1e-9; };

/* accepts "−2, −3", "x = 5 or x = -5", "±5", "+-5" */
function parseNums(s){
  s=String(s).replace(/[−–]/g,'-').replace(/\+\s*-|-\s*\+/g,'±');
  const out=[]; const re=/(±)?\s*(-?\d*\.?\d+)/g; let m;
  while((m=re.exec(s))){ const n=parseFloat(m[2]); if(isNaN(n)) continue; if(m[1]){ out.push(Math.abs(n),-Math.abs(n)); } else out.push(n); }
  return out;
}

/* ============ finish ============ */
function renderFinish(){
  const main=scoreOf([0,1,2,3]), pct=main.max?Math.round(100*main.pts/main.max):0;
  const left=PROBS.map((P,p)=>probDone(p)?null:`Problem ${p+1} (${P.short})`).filter(Boolean);
  const rows=PROBS.map((P,p)=>({P,p,sc:scoreOf([p])}));
  const xs=EXTRA.map((_,j)=>FIN+1+j), xsc=scoreOf(xs);
  const weak=rows.filter(r=>r.sc.pts<r.sc.max).map(r=>TOPICS[r.p].t);
  $('#prob').innerHTML=`<section class="panel">
    <div class="eyebrow">${left.length?'Not finished yet':'Warm-up complete!'}</div>
    <div class="scorebig"><div><div class="num">${fmtPts(main.pts)}<span> / ${main.max}</span></div><div class="pct">${pct}%</div></div>
      <p>${main.first} of ${main.max} answers right on the first try.${left.length?`<br><b>Still to finish:</b> ${left.join(', ')}.`:''}</p></div>
    <p class="scorenote">Scoring: 1 point for a right answer on the first try, ½ point if it took more tries, 0 if you showed the solution. Drawings are not scored.</p>
    <table class="data scoretab"><thead><tr><th>Problem</th><th>Score</th><th>First try</th><th></th></tr></thead><tbody>
      ${rows.map(({P,p,sc})=>`<tr><td><b>${p+1}. ${P.title}</b></td><td class="mono">${fmtPts(sc.pts)} / ${sc.max}</td><td class="mono">${sc.first} / ${sc.max}</td>
        <td><button class="btn small ${sc.pts<sc.max&&probDone(p)?'blue':''}" data-more="${TOPICS[p].t}">More like this</button></td></tr>`).join('')}
    </tbody></table>
    ${xs.length?`<p style="margin-top:12px"><b>Extra practice:</b> <span class="mono">${fmtPts(xsc.pts)} / ${xsc.max}</span> (${xsc.first} right on the first try, ${EXTRA.length} problem${EXTRA.length>1?'s':''})</p>`:''}
    <h3 style="font-size:20px;margin-top:20px">Want more practice?</h3>
    <p style="margin:4px 0 10px">Each button makes a new problem like the ones above, with different numbers. ${weak.length?'Blue buttons are the topics where you lost points.':''}</p>
    <div class="row">
      ${weak.length?`<button class="btn blue" data-set="weak">Practice what I missed (${weak.length})</button>`:''}
      <button class="btn primary" data-set="mixed">Mixed set: one of each</button>
    </div>
    <h3 style="font-size:20px;margin-top:22px">How ready do you feel?</h3>
    <div class="conf">${PROBS.map((P,p)=>`<div class="item"><b>${P.title}</b><div class="row">${['Got it','Need another look'].map(o=>`<button class="btn small" data-p="${p}" data-o="${o}" aria-pressed="${S.conf[p]===o}">${o}</button>`).join('')}</div></div>`).join('')}</div>
    <h3 style="font-size:20px;margin-top:20px">Before the test, remember</h3>
    <ul class="tips">
      <li><b>Graphing:</b> type y = (the quadratic) into Desmos. The solutions are the <b>x-intercepts</b>. Sketch the graph and label them.</li>
      <li><b>Two methods:</b> show both, step by step. Square roots need <b>±</b>. Factoring, graphing, and the quadratic formula all count as methods.</li>
      <li><b>Projectile motion:</b> the ground is <b>h = 0</b>. Throw out negative time. Round to the nearest hundredth if asked.</li>
      <li><b>Area:</b> area = width × length. Write the equation, solve, throw out a negative width, then find <b>both</b> dimensions.</li>
      <li><b>Diagrams:</b> draw them and <b>label</b> every number.</li>
    </ul>
    <div class="nav"><button class="btn" id="back">← Back to Problem ${PROBS.length}</button></div>
  </section>`;
  $('#prob').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ S.conf[b.dataset.p]=b.dataset.o; save(); renderFinish(); });
  $('#prob').querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>addExtra([b.dataset.more]));
  $('#prob').querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>addExtra(b.dataset.set==='weak'?weak:TOPICS.map(t=>t.t)));
  $('#back').onclick=()=>show(PROBS.length-1);
}

/* ============ scratch board ============ */
const Board={
  pen:'ink', thick:false, strokes:[], key:null, cv:null, ctx:null, drawing:null,
  init(){
    this.cv=$('#board'); this.ctx=this.cv.getContext('2d');
    const box=$('#boardbox');
    if(S.grid!==false) box.classList.add('grid');
    $('#gridT').setAttribute('aria-pressed', S.grid!==false);
    this.setPen(this.pen);
    document.querySelectorAll('[data-pen]').forEach(b=>b.onclick=()=>this.setPen(b.dataset.pen));
    $('#thick').onclick=()=>{ this.thick=!this.thick; $('#thick').setAttribute('aria-pressed',this.thick); };
    $('#gridT').onclick=()=>{ S.grid = S.grid===false; box.classList.toggle('grid', S.grid!==false); $('#gridT').setAttribute('aria-pressed', S.grid!==false); save(); };
    $('#undo').onclick=()=>{ this.strokes.pop(); this.commit(); };
    $('#clear').onclick=()=>{ if(this.strokes.length && confirm('Clear this board?')){ this.strokes.length=0; this.commit(); } };
    $('#bigT').onclick=()=>{ const t=$('#tools'); t.classList.toggle('big'); $('#bigT').textContent=t.classList.contains('big')?'Smaller':'Bigger'; this.resize(); };
    const pos=e=>{ const r=this.cv.getBoundingClientRect(); return [+((e.clientX-r.left)/r.width).toFixed(4),+((e.clientY-r.top)/r.height).toFixed(4)]; };
    this.cv.onpointerdown=e=>{ e.preventDefault(); this.cv.setPointerCapture(e.pointerId); this.drawing={c:this.pen, w:this.pen==='erase'?(this.thick?0.06:0.03):(this.thick?0.009:0.004), pts:[pos(e)]}; this.strokes.push(this.drawing); this.redraw(); };
    this.cv.onpointermove=e=>{ if(!this.drawing) return; const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; evs.forEach(ev=>this.drawing.pts.push(pos(ev))); this.redraw(); };
    const end=()=>{ if(this.drawing){ this.drawing=null; this.commit(); } };
    this.cv.onpointerup=end; this.cv.onpointercancel=end;
    new ResizeObserver(()=>this.resize()).observe(box);
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>this.redraw());
  },
  setPen(p){ this.pen=p; document.querySelectorAll('[data-pen]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.pen===p)); },
  load(i){ this.key=i; this.strokes = S.boards[i] || (S.boards[i]=[]); this.resize(); },
  commit(){ S.boards[this.key]=this.strokes; save(); this.redraw(); },
  resize(){ const r=this.cv.getBoundingClientRect(); if(!r.width) return; const d=window.devicePixelRatio||1;
    this.cv.width=Math.round(r.width*d); this.cv.height=Math.round(r.height*d); this.redraw(); },
  redraw(){
    const c=this.ctx, W=this.cv.width, H=this.cv.height; if(!W) return;
    const css=getComputedStyle(document.documentElement), col={ink:css.getPropertyValue('--ink').trim(), blue:css.getPropertyValue('--pen-blue').trim(), red:css.getPropertyValue('--pen-red').trim()};
    c.clearRect(0,0,W,H); c.lineCap='round'; c.lineJoin='round';
    for(const s of this.strokes){
      c.globalCompositeOperation = s.c==='erase'?'destination-out':'source-over';
      c.strokeStyle = s.c==='erase' ? '#000' : col[s.c]; c.fillStyle=c.strokeStyle;
      c.lineWidth = s.w*W;
      if(s.pts.length===1){ c.beginPath(); c.arc(s.pts[0][0]*W, s.pts[0][1]*H, c.lineWidth/2, 0, Math.PI*2); c.fill(); continue; }
      c.beginPath(); c.moveTo(s.pts[0][0]*W, s.pts[0][1]*H);
      for(let k=1;k<s.pts.length;k++) c.lineTo(s.pts[k][0]*W, s.pts[k][1]*H);
      c.stroke();
    }
    c.globalCompositeOperation='source-over';
  }
};
